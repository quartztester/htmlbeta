#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "htmlbeta"
name = "htmlbeta"
description.en = "Zen — a photographic retrospective. Public gallery with a password gate (no YunoHost login)."
description.fr = "Zen — une rétrospective photographique. Galerie publique avec mot de passe (sans compte YunoHost)."

version = "1.0~ynh7"

maintainers = ["quartztester"]

[upstream]
license = "MIT"
website = "https://zen.erikmakela.com"
code = "https://github.com/quartztester/htmlbeta"

[integration]
yunohost = ">= 11"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "150M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    help.en = "The gallery is public: anyone with the password can view. No YunoHost account needed."

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = true
