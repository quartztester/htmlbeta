#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# Photographs and clips require the gate cookie (see nginx-map.conf, http level).
# Two alias rules for the same install dir avoid nested-location alias bugs.

location __PATH__/photos/ {
    alias __INSTALL_DIR__/www/photos/;
    if ($zen_gate_open = 0) { return 403; }
    try_files $uri =404;
}

location __PATH__/clips/ {
    alias __INSTALL_DIR__/www/clips/;
    if ($zen_gate_open = 0) { return 403; }
    try_files $uri =404;
}

location __PATH__/ {
    alias __INSTALL_DIR__/www/;
    index index.html;
    try_files $uri $uri/ =404;
}
